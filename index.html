<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b2b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCTV">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>고속도로 CCTV</title>
<style>
/* ══════════════ 공통 토큰 ══════════════ */
:root{
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --mono:ui-monospace,Consolas,"D2Coding",monospace;
}
/* 클래식 — 기존 프로그램 값 그대로 (LIGHT_GRAY #D3D3D3, GRAY #808080) */
body.classic{
  --bg:#ECECEC; --panel:#D3D3D3; --panel2:#C4C4C4; --line:#000; --line2:#C8C8C8;
  --fg:#000; --dim:#444; --acc:#0A55A8; --stage:#808080; --title:#D3D3D3;
  --radius:0px; --font:"돋움",Dotum,"맑은 고딕","Malgun Gothic",sans-serif;
  --scb:#A9A9A9; --scbh:#8C8C8C;
}
/* 개선 — 구조는 기존 그대로, 외형만 정리 */
body.modern{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a323d; --line2:#2a323d;
  --fg:#e6edf3; --dim:#8b949e; --acc:#4493f8; --stage:#000; --title:#1c232d;
  --radius:10px; --font:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",-apple-system,sans-serif;
  --scb:#39424f; --scbh:#4d5868;
}
/* 재해석 — 영상이 주인공. 조작부는 영상 위에 얹고, 목록은 하단 스트립으로 */
body.reimagined{
  --bg:#07080a; --panel:rgba(22,24,30,.72); --panel2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.10);
  --fg:#f2f4f7; --dim:#9aa3af; --acc:#ff6b35; --stage:#000; --title:transparent;
  --radius:14px; --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;
  --scb:rgba(255,255,255,.17); --scbh:rgba(255,255,255,.3);
}
body.reimagined #main{position:relative}
body.reimagined #side{position:absolute;left:0;top:0;bottom:0;z-index:60;
  background:rgba(10,11,14,.94);backdrop-filter:blur(14px);border-right:1px solid var(--line2)}
body.reimagined #side.closed{display:none}
/* 목록이 열려 있을 때 뒤를 덮는 면 — 눌러서 닫는다 */
#sideBackdrop{display:none;position:absolute;inset:0;z-index:55;background:rgba(0,0,0,.45)}
#sideBackdrop.on{display:block}
body.reimagined .vtab{display:none}
body.reimagined #top{position:absolute;left:0;right:0;top:var(--st);z-index:40;
  background:linear-gradient(rgba(0,0,0,.72),transparent);border:none;padding:10px 12px 22px}
body.reimagined .tbtn{background:var(--panel2);border:1px solid var(--line2);
  backdrop-filter:blur(10px);border-radius:20px}
body.reimagined #app{padding-top:0}
body.reimagined .live{background:rgba(0,0,0,.55);backdrop-filter:blur(10px);
  border:1px solid var(--line2)}
body.reimagined .live.g{color:#4ade80} body.reimagined .live.y{color:#fbbf24}
body.reimagined .live.r{color:#f87171}
body.reimagined #grid{gap:0;background:#000}
body.reimagined .gridrow{gap:0}
body.reimagined .cell{border:0}
body.reimagined .cell .ttl{top:auto;bottom:0;padding:20px 10px 8px;font-size:12.5px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;border:none;
  text-shadow:0 1px 4px #000}
body.reimagined .cell .x{top:auto;bottom:6px;right:6px;width:26px;height:26px;
  background:rgba(0,0,0,.5);border-radius:50%;color:#fff}
body.reimagined .cell.sel{outline:2px solid var(--acc);outline-offset:-2px}
/* 하단 카메라 스트립 — 터치는 스와이프, PC 는 휠·드래그·화살표 */
#striprow{display:none;position:relative;flex:0 0 auto;background:rgba(8,9,11,.96);
  border-top:1px solid var(--line2)}
body.reimagined #striprow{display:block}
#strip{display:flex;gap:8px;padding:9px 54px calc(9px + var(--sb));
  overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;cursor:grab}
#strip.drag{cursor:grabbing;scroll-behavior:auto}
#strip::-webkit-scrollbar{display:none}
/* 화살표 글자만 얹어 두니 버튼이 있는 줄도 모른다 — 동그란 판을 깔아 드러낸다 */
.snav{position:absolute;top:0;bottom:0;width:48px;display:grid;place-items:center;
  background:linear-gradient(90deg,rgba(8,9,11,.98),rgba(8,9,11,0));
  color:#fff;font-size:20px;z-index:5}
.snav span{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);
  box-shadow:0 2px 10px rgba(0,0,0,.55);line-height:1;padding-bottom:3px}
.snav:hover{background:linear-gradient(90deg,rgba(8,9,11,1),rgba(8,9,11,.4))}
.snav:hover span{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.55)}
.snav.r{right:0;background:linear-gradient(270deg,rgba(8,9,11,.98),rgba(8,9,11,0))}
.snav.r:hover{background:linear-gradient(270deg,rgba(8,9,11,1),rgba(8,9,11,.4))}
.snav.off{opacity:.25;pointer-events:none}   /* 끝에 닿으면 흐리게 */
.scard{flex:0 0 auto;min-width:96px;max-width:150px;padding:9px 12px;border-radius:12px;
  background:var(--panel2);border:1px solid var(--line2);font-size:12.5px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:44px;
  display:flex;align-items:center;gap:6px}
.scard.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.scard .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.scard.on .dot{background:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font:15px/1.5 var(--font)}
button,select,input{font-family:inherit;font-size:15px;color:inherit}
button{background:none;border:none;cursor:pointer}

/* ══════════════ 게이트 ══════════════ */
#gate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
      padding:20px;background:#1f2937}
#gate.hide{display:none}
.gcard{width:100%;max-width:360px;background:#fff;color:#111;border-radius:12px;padding:26px 22px;
       box-shadow:0 18px 50px rgba(0,0,0,.35)}
.gcard h1{font-size:18px;margin:0 0 3px;text-align:center}
.gcard .s{font-size:12.5px;color:#666;text-align:center;margin-bottom:18px}
.gcard label{display:block;font-size:12px;color:#444;margin:12px 0 4px;font-weight:600}
.gcard input,.gcard select{width:100%;padding:11px;border:1px solid #bbb;border-radius:7px;
  background:#fff;color:#111;min-height:44px}
.gbtn{width:100%;padding:12px;border-radius:7px;background:#1f2937;color:#fff;font-weight:700;
      margin-top:16px;min-height:46px}
.gmsg{margin-top:11px;font-size:13px;padding:9px 11px;border-radius:6px;display:none}
.gmsg.on{display:block;background:#fdecea;color:#8b241a;border:1px solid #f3b8b1}

/* ══════════════ 앱 ══════════════ */
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--st);padding-bottom:var(--sb)}
#app.hide{display:none}

/* 상단바 */
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);
     border-bottom:1px solid var(--line2);flex:0 0 auto;flex-wrap:wrap}
body.classic #top{border-bottom:1px solid #999}
#top h1{font-size:14px;margin:0;font-weight:700;white-space:nowrap}
.tbtn{padding:8px 13px;background:var(--panel2);border:1px solid var(--line2);
      border-radius:var(--radius);min-height:38px;white-space:nowrap;font-size:13.5px}
body.classic .tbtn{border:1px solid #888;background:#D3D3D3}
.tbtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sp{flex:1}
.live{font-family:var(--mono);font-size:12.5px;font-weight:800;padding:3px 10px;
      border-radius:12px;background:rgba(0,0,0,.12);white-space:nowrap}
body.modern .live{background:#0a0d12}
.live.g{color:#1a7f37} .live.y{color:#9a6700} .live.r{color:#c0392b}
body.modern .live.g{color:#3fb950} body.modern .live.y{color:#d29922} body.modern .live.r{color:#f85149}

/* 본문 */
#main{flex:1 1 auto;min-height:0;display:flex}
#side{flex:0 0 auto;display:flex;background:var(--panel);border-right:1px solid var(--line2)}
body.classic #side{border-right:1px solid #999}
.col{display:flex;flex-direction:column;width:190px;min-width:0}
.col.hide{display:none}
.colhead{display:flex;flex-direction:column;gap:4px;padding:6px}
.colhead button{padding:10px;background:var(--panel2);border:1px solid var(--line2);
  border-radius:var(--radius);min-height:40px;font-size:13.5px}
body.classic .colhead button{border:1px solid #888;background:#D3D3D3}
.list{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* 목록 두 칸에 브라우저 기본 막대가 밝게 떠서 화면 톤과 따로 놀았다.
   스킨 색을 따라가도록 얇게 다시 그린다. */
.list,.sheet,#stage{scrollbar-width:thin;scrollbar-color:var(--scb) transparent}
.list::-webkit-scrollbar,.sheet::-webkit-scrollbar,#stage::-webkit-scrollbar{width:10px}
.list::-webkit-scrollbar-track,.sheet::-webkit-scrollbar-track,
#stage::-webkit-scrollbar-track{background:transparent}
.list::-webkit-scrollbar-thumb,.sheet::-webkit-scrollbar-thumb,
#stage::-webkit-scrollbar-thumb{background:var(--scb);border-radius:6px;
  border:3px solid transparent;background-clip:content-box}
.list::-webkit-scrollbar-thumb:hover,.sheet::-webkit-scrollbar-thumb:hover,
#stage::-webkit-scrollbar-thumb:hover{background:var(--scbh);background-clip:content-box}
.item{padding:9px 11px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:14px;
      display:flex;align-items:center;gap:8px;min-height:42px}
body.classic .item{border:1px solid #C8C8C8;border-width:0 0 1px 0}
.item:hover{background:var(--panel2)}
.item.on{background:var(--acc);color:#fff}
.item .idx{font-family:var(--mono);font-size:11px;opacity:.6;flex:0 0 auto;width:22px}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .star{flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;
  font-size:16px;color:var(--dim);background:transparent;border-radius:6px}
.item .star:hover{background:rgba(128,128,128,.2)}
.item .star.on{color:#f0b429}
.item.on .star{color:rgba(255,255,255,.7)}
.item.on .star.on{color:#ffd75e}
/* 세로 접기 탭 — 원본의 ┃고┃속┃도┃로┃ 재현 */
.vtab{width:26px;background:var(--panel);border-left:1px solid var(--line);
      border-right:1px solid var(--line);display:flex;flex-direction:column;
      align-items:center;justify-content:center;cursor:pointer;gap:1px;font-size:12px;
      user-select:none;flex:0 0 auto}
body.modern .vtab{border-color:var(--line2)}
.vtab:hover{background:var(--panel2)}
.vtab span{line-height:1.15}

/* 무대 */
#stage{flex:1 1 auto;min-width:0;background:var(--stage);position:relative;overflow:hidden}
#grid{display:flex;flex-direction:column;width:100%;height:100%;gap:2px;background:var(--line2)}
.gridrow{display:flex;flex:1 1 0;gap:2px;min-height:0}
.cell{flex:1 1 0;position:relative;background:#000;min-width:0;overflow:hidden}
/* W·E 로 조절하는 명암 — 야간 화면을 볼 때 쓴다.
   돋보기(--mag)는 화면 하나하나에 따로 걸린다. */
.cell video{width:100%;height:100%;object-fit:contain;background:#000;display:block;
  filter:contrast(var(--vfx,1));transform:scale(var(--mag,1));transform-origin:center}
/* 돋보기로 확대하면 원본 어디를 보고 있는지 네모로 알려준다. 끌어서 옮긴다. */
.cell .vbox{display:none;position:absolute;z-index:2;pointer-events:auto;
  border:2px solid rgba(255,255,255,.9);border-radius:4px;cursor:grab;
  box-shadow:0 0 0 9999px rgba(0,0,0,.28),0 2px 10px rgba(0,0,0,.6)}
.cell.mag .vbox{display:block}
.cell .vbox.grab{cursor:grabbing}
#toast{position:fixed;left:50%;top:calc(14px + var(--st));transform:translateX(-50%);
  z-index:1200;padding:8px 16px;border-radius:999px;background:rgba(0,0,0,.82);
  color:#fff;font-size:13px;font-weight:700;pointer-events:none;
  opacity:0;transition:opacity .18s}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
.cell.fit video{object-fit:fill}
.cell .ttl{position:absolute;left:0;right:0;top:0;padding:3px 7px;font-size:11.5px;font-weight:700;
  background:var(--title);color:var(--fg);border-bottom:1px solid var(--line2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.modern .cell .ttl{background:linear-gradient(rgba(0,0,0,.75),transparent);border:none;
  color:#fff;text-shadow:0 1px 3px #000}
.cell .x{position:absolute;top:2px;right:3px;width:22px;height:20px;display:grid;place-items:center;
  font-size:13px;color:var(--dim);background:transparent}
.cell .x:hover{color:#c0392b}
.cell .rf{position:absolute;top:2px;right:26px;width:22px;height:20px;display:grid;place-items:center;
  font-size:13px;color:var(--dim);background:transparent}
.cell .rf:hover{color:var(--acc)}
/* 버튼째 돌리면 배경과 테두리까지 함께 돈다 — 안쪽 아이콘만 돌린다 */
/* 화면마다 받는 속도와 라이브 지연을 띄운다 — 어느 카메라가 말썽인지 바로 보인다 */
.cell .bdg{position:absolute;top:5px;right:5px;z-index:3;padding:2px 7px;
  border-radius:6px;background:rgba(0,0,0,.55);color:#cfd8e3;
  font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;
  pointer-events:none;white-space:nowrap;letter-spacing:.2px}
.cell .bdg:empty{display:none}
.cell.slow .bdg{background:rgba(90,62,0,.78);color:#ffd479}
/* 기존·개선 스킨은 넓은 화면에서 우측 상단을 버튼이 쓰므로 반대편으로 비킨다 */
body.classic .cell .bdg,body.modern .cell .bdg{right:auto;left:5px;top:26px}
/* 카메라 쪽이 실시간보다 느리게 보내는 화면 — 앱 탓이 아님을 알려준다 */
.cell.slow .ttl{color:#ffd479}
.cell.slow .ttl::after{content:'· 소스 느림';margin-left:5px;font-size:11px;
  opacity:.9;white-space:nowrap;font-weight:400}
.cell .rf .ic{display:block;line-height:1}
.cell .rf.spin .ic{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.cell .rf.spin .ic{animation:none}}
body.reimagined .cell .rf{top:auto;bottom:6px;right:38px;width:26px;height:26px;
  background:rgba(0,0,0,.5);border-radius:50%;color:#fff}
.cell.sel{outline:2px solid var(--acc);outline-offset:-2px}
/* 오버레이는 안내만 하고 클릭은 통과시킨다.
   예전에는 셀 전체를 덮어, 연결 중이거나 실패한 화면의 버튼을 아예 누를 수 없었다. */
.cell .ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);
  color:#ccc;font-size:12px;text-align:center;padding:8px;pointer-events:none;z-index:1}
.cell .ov.hide{display:none}
.cell .mg,.cell .zm,.cell .rf,.cell .x{z-index:3}
.cell .ttl{z-index:2}
#empty{position:absolute;inset:0;display:grid;place-items:center;color:#eee;font-size:14px;
  text-align:center;padding:20px;pointer-events:none}
#empty.hide{display:none}
/* 크게 보기 — 나머지는 감추기만 하고 재생은 그대로 둔다(다시 돌아올 때 즉시 보임) */
#grid.zoomed .gridrow{display:none}
#grid.zoomed .gridrow.hasZoom{display:flex;flex:1 1 100%}
#grid.zoomed .cell{display:none}
#grid.zoomed .cell.zoom{display:block;flex:1 1 100%}
.cell .mg{position:absolute;top:2px;right:72px;width:22px;height:20px;display:grid;
  place-items:center;font-size:13px;color:var(--dim);background:transparent;z-index:3}
.cell .mg:hover{color:var(--acc)}
.cell.mag .mg{color:var(--acc)}
.cell .zm{position:absolute;top:2px;right:49px;width:22px;height:20px;display:grid;
  place-items:center;font-size:12px;color:var(--dim);background:transparent}
.cell .zm:hover{color:var(--acc)}
body.reimagined .cell .mg{top:auto;bottom:6px;right:102px;width:26px;height:26px;
  background:rgba(0,0,0,.5);border-radius:50%;color:#fff}
body.reimagined .cell .zm{top:auto;bottom:6px;right:70px;width:26px;height:26px;
  background:rgba(0,0,0,.5);border-radius:50%;color:#fff}
#grid.zoomed .cell.zoom .zm{color:var(--acc)}

/* 시트 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:900;
       align-items:center;justify-content:center;padding:16px}
.sheet.on{display:flex}
.sheet-in{background:var(--bg);border:1px solid var(--line2);border-radius:var(--radius);
  padding:18px;max-width:460px;width:100%;max-height:88vh;overflow-y:auto}
body.classic .sheet-in{border:2px solid #888}
.sheet h2{font-size:16px;margin:0 0 12px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:15px;cursor:pointer}
.chk input{width:18px;height:18px}
.note{font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:8px}
.btn{display:block;width:100%;padding:12px;border-radius:var(--radius);background:var(--panel2);
  border:1px solid var(--line2);text-align:center;margin-top:9px;min-height:46px}
.btn.pri{background:var(--acc);color:#fff;font-weight:700;border-color:var(--acc)}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;padding:10px 4px;border:1px solid var(--line2);border-radius:var(--radius);
  background:var(--panel2);font-size:13px;min-height:42px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}

/* 좁은 화면 전용 목록 탭 (넓은 화면에서는 세로 탭을 쓰므로 숨김) */
#listTabs{display:none}
#listTabs button{flex:1;padding:12px 6px;font-size:14px;background:var(--panel2);
  border:0;border-bottom:2px solid transparent;color:var(--dim);min-height:46px}
#listTabs button.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:700;
  background:var(--panel)}
#listTabs button.close{flex:0 0 52px;font-size:17px}

/* ══════════════ 좁은 화면 ══════════════ */
@media(max-width:760px){
  #main{position:relative}
  /* 목록은 화면을 거의 다 쓰는 오버레이로 — 좁은 칸에 두 목록을 욱여넣지 않는다 */
  #side{position:absolute;left:0;top:0;bottom:0;width:min(92vw,420px);z-index:60;
        flex-direction:column;border-right:1px solid var(--line2);
        box-shadow:6px 0 22px rgba(0,0,0,.45)}
  #side.closed{display:none}
  #sideBackdrop{z-index:55}
  #listTabs{display:flex}
  .vtab{display:none}                     /* 세로 접기 탭은 좁은 화면에서 무의미 */
  .col{width:100%;flex:1 1 auto;min-height:0}
  .col.hide{display:none}

  #stage{overflow-y:auto;-webkit-overflow-scrolling:touch}
  #grid{height:auto;min-height:100%}
  /* align-items 기본값 stretch 는 칸을 줄 높이에 맞춰 늘린다.
     그러면 높이가 auto 가 아니게 되어 aspect-ratio 가 무시된다 —
     크게 보기를 닫을 때 늘어난 줄 높이가 그대로 남아 칸 하나가 화면을 다 먹었다. */
  .gridrow{flex:0 0 auto;justify-content:flex-start;align-items:flex-start}
  /* 영상은 16:9 라 4:3 칸에 담으면 아래가 남는다.
     영상을 위로 붙여 그 남는 검은 자리에 조작줄을 넣는다 — 영상을 가리지 않는다. */
  /* 폭은 열 수로 고정한다 — 줄 끝에 한 칸만 남아도 크기가 같다 */
  .cell{aspect-ratio:4/3;
    flex:0 0 calc((100% - (var(--cols,2) - 1) * var(--gp,2px)) / var(--cols,2))}
  /* 맨 윗줄이 한 칸뿐일 때만 가로를 다 쓴다 — 홀수일 때의 큰 화면 */
  .gridrow:first-child > .cell:only-child{flex:0 0 100%}
  body.reimagined #grid{--gp:0px}
  /* 설정은 ☰ 안에도 있다 — 좁은 화면에서는 상단 자리를 이름에 내준다 */
  #bSet{display:none}
  .cell video{object-position:top}
  #grid.zoomed{height:100%}
  #grid.zoomed .cell.zoom{aspect-ratio:auto;height:100%}
  #grid.zoomed .cell.zoom video{object-position:center}

  /* 영상 아래 검은 자리에 한 줄 — 버튼 셋, 그 다음 이름.
     별도 영역을 만들지 않으므로 영상 크기는 그대로다. */
  #grid .cell .zm,
  #grid .cell .rf,
  #grid .cell .mg,
  #grid .cell .x{display:grid;top:auto;bottom:4px;right:auto;width:26px;height:26px;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);

  #grid .cell .mg{left:5px}

  /* 이름 뒤에만 옅게 깔아 어떤 배경에서도 읽히게 한다 — 글자 길이만큼만.

  #grid .cell .ttl{top:auto;bottom:4px;left:auto;right:5px;height:26px;

   지연을 줄이는 유일한 방법은 버퍼를 얇게 두는 것인데, 너무 얇으면 끊긴다.
   그래서 고정값을 쓰지 않고 '끊기지 않는 최소 버퍼'를 실시간으로 찾아간다.
   무사고 구간이 이어지면 조금씩 줄이고, 한 번이라도 끊기면 즉시 늘린다. */
/* 올릴 땐 조금만, 내릴 땐 자주 — 한 번 끊겼다고 계속 뒤처진 채로 두지 않는다.
   heal 은 '무사고 몇 초가 지나면 줄일지'. */
/* 회선 여유를 실측해 '끊기지 않는 최소 버퍼'를 계속 추적한다.
   live 는 단발성 끊김에 반응하지 않고 반복될 때만 아주 조금 올린다. */
const MODES={
  live:{start:1.6, min:1.0, max:3.2, down:0.5, up:0.4, heal:8,  rate:1.5, multi:0.15},
  bal :{start:3.0, min:2.0, max:7.0, down:0.4, up:0.8, heal:14, rate:1.3, multi:0.25},
  safe:{start:6.0, min:4.0, max:12 , down:0.3, up:1.0, heal:20, rate:1.15,multi:0.35}
};
if(!MODES[S.mode]) S.mode='live';       // 없어진 모드가 저장돼 있으면 되돌린다
const Tune={cur:MODES.live.start, stalls:0, sinceStall:0, seeks:0,
            lastUp:0, lastFix:0, recent:[]};

function modeCfg(){ return MODES[S.mode]||MODES.live; }
/* 대수가 늘면 조각 도착이 들쭉날쭉해지므로 약간 보정한다.
   다만 회선이 충분하면 20대에서도 1~2초가 나오므로 보정폭은 작게 잡는다. */
function bufFor(){
  const m=modeCfg();
  const bonus=Math.max(0,(S.open.length-2))*(m.multi??0.2);
  return +(Tune.cur+Math.min(bonus,0.8)).toFixed(2);
}
/* 안 보이는 동안 재생을 세워둔 상태인지 — 아래 감시 타이머들이 이 값을 본다.
   (참조하는 곳보다 반드시 먼저 선언해야 한다) */
let dormant=false, sleepTimer=null;
function hlsConfig(){
  const m=modeCfg(), b=bufFor();
  return {
    lowLatencyMode:true, enableWorker:true,
    liveSyncDuration:b,
    /* 이 값을 넘게 뒤처지면 hls.js 가 스스로 라이브 엣지로 복귀한다.
       크게 잡으면 한번 밀린 뒤 영영 따라잡지 못하므로 타이트하게 둔다. */
    liveMaxLatencyDuration:b+2.5,
    maxLiveSyncPlaybackRate:m.rate,
    /* 지나간 구간은 되감기용인데 이 앱은 라이브 엣지로만 간다 — 짧게 잡아 메모리를 아낀다 */
    backBufferLength:memCfg().back,
    /* 앞으로 저장해 둘 양은 재생 위치(liveSyncDuration)와 별개다.
       넉넉히 잡아도 지연은 늘지 않고 순간 장애에만 강해진다. */
    maxBufferLength:Math.max(8,b*3),
    manifestLoadingTimeOut:8000, levelLoadingTimeOut:8000, fragLoadingTimeOut:12000,
    /* 이 스트림은 화질이 하나뿐이라 capLevelToPlayerSize 는 효과가 없다. */
    maxBufferSize:memCfg().size
  };
}
/* 24시간 켜 두는 화면이다. 화면당 상한을 그대로 두면 대수만큼 곱해져
   (기본값 60MB × 12대 = 720MB) 모바일 브라우저가 탭째 정리해 버린다.
   총량을 정해 놓고 대수로 나눠 쓴다. */
function memCfg(){
  const n=Math.max(1,S.open.length);
  if(S.low) return {size:4*1000*1000, back:0};
  return {size:Math.min(60,Math.max(8,Math.floor(150/n)))*1000*1000,
          back:n>6?0:4};
}
/* 버퍼를 바꿔도 재생을 끊지 않는다 — hls.js 설정을 런타임에 갱신 */
function applyTune(){
  const b=bufFor();
  S.open.forEach(o=>{ if(o.hls){
    o.hls.config.liveSyncDuration=b;
    o.hls.config.liveMaxLatencyDuration=b+2.5;
    /* 버퍼 한도도 함께 갱신한다. 예전에는 이 둘이 연결 시점 값에 묶여 있어,
       '안정' 모드로 바꿔도 이미 열려 있던 화면은 약속한 만큼 버퍼를 쌓지 못했다. */
    /* 대수가 바뀌면 화면당 메모리 몫도 달라진다 — 함께 갱신한다 */
    const mem=memCfg();
    o.hls.config.backBufferLength=mem.back;
    o.hls.config.maxBufferSize=mem.size;
    o.hls.config.maxBufferLength=Math.max(8,b*3);
  }});
  LS.set('tune',Tune.cur);
}
/* 끊김 한 번에 바로 버퍼를 올리지 않는다.
   네트워크는 원래 가끔 흔들리며, 그때마다 올리면 지연이 계속 누적된다.
   12초 안에 3번 이상 끊길 때만 '정말 부족한 것'으로 보고 올린다. */
function onStall(){
  const m=modeCfg(), now=Date.now();
  Tune.sinceStall=0;
  if(!m.up) return;                                  // 고정 모드는 올리지 않음
  Tune.recent=Tune.recent.filter(t=>now-t<12000);
  Tune.recent.push(now);
  if(Tune.recent.length<3) return;                   // 단발성은 무시
  if(now-Tune.lastUp<6000) return;                   // 동시 다발도 한 번만
  Tune.lastUp=now; Tune.stalls++; Tune.recent=[];
  if(Tune.cur<m.max){
    Tune.cur=Math.min(m.max,+(Tune.cur+m.up).toFixed(2));
    applyTune();
  }
}
/* ── 대역폭 기반 자동 제어 ────────────────────────────────────
   조각 하나를 받는 데 걸린 시간과 조각 길이를 비교하면 회선 여유가 그대로 나온다.
   1초짜리를 0.2초에 받으면 여유 5배, 0.8초 걸리면 1.25배로 아슬아슬하다.
   이 값과 버퍼 잔량을 함께 보고 '끊기지 않는 최소 버퍼'를 계속 추적한다.
   회선이 넉넉하면 대수가 많아도 1~2초를 유지하고, 좁아지면 필요한 만큼만 늘린다. */
function netMargin(){                       // 가장 빠듯한 화면 기준
  let worst=Infinity;
  S.open.forEach(o=>{
    if(!o.margins||!o.margins.length) return;
    const avg=o.margins.reduce((a,b)=>a+b,0)/o.margins.length;
    if(avg<worst) worst=avg;
  });
  return isFinite(worst)?worst:null;
}
function minBuffer(){
  let m=Infinity;
  S.open.forEach(o=>{
    const v=o.cell?.querySelector('video'); if(!v) return;
    try{
      for(let i=0;i<v.buffered.length;i++)
        if(v.buffered.start(i)<=v.currentTime && v.currentTime<=v.buffered.end(i))
          m=Math.min(m, v.buffered.end(i)-v.currentTime);
    }catch(_){}
  });
  return isFinite(m)?m:null;
}
setInterval(()=>{
  if(!S.open.length || dormant) return;
  const m=modeCfg();
  if(!m.up) return;                          // 고정 모드는 건드리지 않는다
  const mg=netMargin(), buf=minBuffer();
  Tune.margin=mg; Tune.minBuf=buf;
  if(mg==null) return;

  let delta=0, why='';
  if(buf!=null && buf<0.4){ delta=+0.5; why='버퍼 고갈 직전'; }
  else if(mg<1.8)         { delta=+0.3; why='회선 빠듯'; }
  else if(mg>3.5 && (buf==null||buf>0.8) && Tune.cur>m.min){
                            delta=-0.3; why='여유 있음'; }
  if(!delta){
    /* 조정 없이 오래 버티면 '이 환경에서 검증된 값'으로 기억한다.
       다음에 같은 환경(회선 종류 × 재생 대수)으로 열면 여기서 시작하므로
       매번 처음부터 더듬지 않는다. */
    Tune.stable=(Tune.stable||0)+4;
    if(Tune.stable>=32){ LS.set('lrn_'+netKey(), Tune.cur); Tune.stable=0; }
    return;
  }
  Tune.stable=0;
  const next=Math.max(m.min, Math.min(m.max, +(Tune.cur+delta).toFixed(2)));
  if(next===Tune.cur) return;
  Tune.cur=next; Tune.why=why; applyTune();
},4000);

/* 환경은 사람마다 장소마다 다르다 — 회선 종류와 재생 대수로 구간을 나눠 따로 학습한다.
   집 광랜 4대와 지하철 LTE 1대는 완전히 다른 조건이므로 값을 섞지 않는다. */
function netKey(){
  const c=navigator.connection||{};
  const type=c.effectiveType||(navigator.onLine?'net':'off');
  const bucket=S.open.length<=2?'s':S.open.length<=8?'m':'l';
  return type+'-'+bucket+'-'+S.mode;
}
function loadLearned(){
  const m=modeCfg();
  const v=LS.get('lrn_'+netKey(), null);
  Tune.cur = (typeof v==='number' && v>=m.min && v<=m.max) ? v : m.start;
  Tune.stable=0; applyTune();
}
/* 와이파이↔데이터 전환처럼 회선이 바뀌면 이전 값이 무의미하므로 다시 잡는다 */
if(navigator.connection && navigator.connection.addEventListener){
  navigator.connection.addEventListener('change',()=>{
    S.open.forEach(o=>{ o.margins=[]; });
    loadLearned();
  });
}

/* 라이브 엣지 복귀 감시 ─ 이 앱의 핵심.
   버퍼링·탭 전환·네트워크 지터로 재생 위치가 한번 밀리면 스스로는 안 돌아온다.
   목표보다 크게 뒤처졌으면 엣지 근처로 직접 당겨서 '라이브에 가깝게'를 유지한다. */
function edgeOf(hls){
  const d=hls?.levels?.[hls.currentLevel]?.details;
  if(!d) return null;
  return d.edge ?? (d.fragments?.length
    ? d.fragments[d.fragments.length-1].start+d.fragments[d.fragments.length-1].duration : null);
}
setInterval(()=>{
  if(!S.open.length || dormant) return;
  const limit=bufFor()+2;
  // 뒤처진 화면 중 '가장 심한 하나'만 당긴다.
  // 전부 동시에 seek 하면 다 같이 버퍼를 비워 화면이 한꺼번에 멈춘다.
  let worst=null, worstBehind=limit;
  S.open.forEach(o=>{
    /* 느린 소스야말로 당겨줘야 한다.
       6초에 2초치만 오는 화면을 그냥 두면 재생 위치가 계속 뒤로 밀려
       한참 지난 장면을 보게 된다. 끊기더라도 최신을 보여주는 편이 감시에 맞다
       (사용자가 새로고침을 누를 때 실제로 일어나는 일이 이것이다). */
    if(!o.hls) return;
    const v=o.cell?.querySelector('video');
    if(!v || v.paused || v.readyState<2 || v.seeking) return;
    const edge=edgeOf(o.hls);
    if(edge==null || !isFinite(edge) || v.currentTime<=0) return;
    const behind=edge-v.currentTime;
    if(behind>worstBehind){ worst={o,v,edge}; worstBehind=behind; }
  });
  if(!worst) return;
  const target=Math.max(0, worst.edge-Math.max(1.0, bufFor()*0.8));
  try{
    const buf=worst.v.buffered;
    for(let i=0;i<buf.length;i++){
      if(target>=buf.start(i)&&target<=buf.end(i)){
        worst.v.currentTime=target; Tune.seeks++; break;
      }
    }
  }catch(_){}
},3000);

/* ─────────── 레이아웃 (기존 프로그램 규칙 그대로) ───────────
   디컴파일로 확인: 8=4x2, 9=3x3, 10=3/3/4, 12=4x3, 16=4x4, 20=5x4
   10·11·13~15·17~19 는 줄마다 개수가 다른 불균등 배치를 쓴다. */
const SPECIAL={10:[3,3,4],11:[3,4,4],13:[3,3,3,4],14:[3,3,4,4],15:[3,4,4,4],
               17:[4,4,4,5],18:[4,4,5,5],19:[4,5,5,5]};
const XY={1:[1,1],2:[2,1],3:[3,1],4:[2,2],5:[3,2],6:[3,2],7:[4,2],8:[4,2],
          9:[3,3],12:[4,3],16:[4,4],20:[5,4]};
function rowsFor(n){
  if(n<=0) return [];
  /* 좁은 화면에서는 4~5열로 나누면 칸 폭이 100px 도 안 돼 버튼도 이름도 못 넣는다.
     세로로 긴 화면이므로 2열(많으면 3열)로 하고 아래로 스크롤하게 둔다. */
  if(narrow()){
    /* 2열로 나누면 홀수일 때 한 칸이 남는다.
       남는 칸을 맨 끝에 두면 뜬금없이 혼자 커 보이므로 맨 앞에 크게 놓는다 —
       큰 화면 하나에 작은 화면 여럿이 붙는 익숙한 배치가 된다. */
    /* 3열로 가면 칸이 136px 로 줄어 조작줄이 영상을 덮고 이름이 전부 잘린다.
       개수가 많아도 2열을 지키고 아래로 스크롤하게 둔다. */
    if(n<=1) return [1];
    const out=[]; let left=n;
    if(n%2){ out.push(1); left--; }
    while(left>0){ out.push(2); left-=2; }
    return out;
  }
  if(SPECIAL[n]) return SPECIAL[n];
  let x=(XY[n]||[])[0];
  if(!x) x=Math.ceil(Math.sqrt(n));
  const rows=Math.ceil(n/x), out=[]; let left=n;
  for(let i=0;i<rows;i++){ const c=Math.min(x,Math.ceil(left/(rows-i))); out.push(c); left-=c; }
  return out;
}

function makeCell(o){
  const cell=document.createElement('div');
  cell.className='cell';
  cell.innerHTML=`<video playsinline muted autoplay></video>
    <div class="ttl"><span class="no"></span><span class="nm"></span></div>
    <button class="mg" data-mag="0" title="돋보기 (넘패드 +/−)"><span class="ic">＋</span></button>
    <button class="zm" data-zoom="0" title="크게 보기 (더블클릭)">⛶</button>
    <button class="rf" data-reload="0" title="이 화면만 다시 연결"><span class="ic">↻</span></button>
    <button class="x" data-close="0">✕</button>
    <div class="vbox"></div>
    <div class="bdg"></div>
    <div class="ov">연결 중…</div>`;
  /* 끊김 감지는 셀을 만들 때 딱 한 번만 건다.
     bind() 는 재연결마다 호출되므로 거기서 걸면 리스너가 쌓여
     한 번 끊긴 것이 여러 번으로 집계되고 디바운스가 무력화된다. */
  cell.querySelector('video').addEventListener('waiting', onStall);
  return cell;
}
/* ── 돋보기 ─────────────────────────────────────────
   크게 보기(⛶)가 '이 화면을 화면 가득'이라면, 돋보기는 '영상 속을 당겨 보기'다.
   당긴 뒤에는 원본 어디를 보고 있는지 네모로 알려주고, 그 네모를 끌어 옮긴다. */
const MAG=2.2;                                  // 당기는 배율
function applyMag(o){
  const v=o.cell?.querySelector('video'), box=o.cell?.querySelector('.vbox');
  if(!v) return;
  const on=o.mag>1;
  o.cell.classList.toggle('mag', on);
  const ic=o.cell.querySelector('.mg .ic'); if(ic) ic.textContent = on ? '－' : '＋';
  if(!on){ v.style.transform=''; return; }
  o.mx=Math.min(1-0.5/o.mag, Math.max(0.5/o.mag, o.mx ?? 0.5));
  o.my=Math.min(1-0.5/o.mag, Math.max(0.5/o.mag, o.my ?? 0.5));
  // 보려는 지점이 한가운데 오도록 당긴 뒤 밀어준다
  v.style.transform=`scale(${o.mag}) translate(${((0.5-o.mx)*100).toFixed(2)}%,${((0.5-o.my)*100).toFixed(2)}%)`;
  if(box){
    const s=100/o.mag;
    box.style.width=s+'%'; box.style.height=s+'%';
    box.style.left=((o.mx*100)-s/2)+'%'; box.style.top=((o.my*100)-s/2)+'%';
  }
}
function setMag(i,on){
  const o=S.open[i]; if(!o) return;
  o.mag = on ? MAG : 1;
  if(on && o.mx==null){ o.mx=0.5; o.my=0.5; }
  applyMag(o);
}
/* 네모를 끌어 보는 지점을 옮긴다 */
$('#grid').addEventListener('pointerdown',e=>{
  const box=e.target.closest('.vbox'); if(!box) return;
  const cell=box.closest('.cell'); const o=S.open[+cell.dataset.i]; if(!o||o.mag<=1) return;
  e.preventDefault(); e.stopPropagation();
  box.classList.add('grab'); box.setPointerCapture(e.pointerId);
  const r=cell.getBoundingClientRect();
  const move=ev=>{
    o.mx=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));
    o.my=Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height));
    applyMag(o);
  };
  const up=()=>{ box.classList.remove('grab');
    box.removeEventListener('pointermove',move); box.removeEventListener('pointerup',up); };
  box.addEventListener('pointermove',move); box.addEventListener('pointerup',up);
  move(e);
});

function touchCell(cell,o,idx){
  cell.dataset.i=idx;
  cell.querySelector('[data-mag]').dataset.mag=idx;
  applyMag(o);                                  // 자리를 옮겨도 당긴 상태를 유지한다
  /* 번호는 따로 둔다 — 좁은 화면에서는 자리를 이름에 내주고 숨긴다 */
  cell.querySelector('.ttl .no').textContent=`${idx+1}번 : `;
  cell.querySelector('.ttl .nm').textContent=o.cam.n;
  cell.querySelector('[data-close]').dataset.close=idx;
  cell.querySelector('[data-reload]').dataset.reload=idx;
  cell.querySelector('[data-zoom]').dataset.zoom=idx;
  cell.classList.toggle('sel', idx===S.active);
  cell.classList.toggle('fit', !S.fit);
  cell.classList.toggle('zoom', idx===S.zoom);
}
/* 크게 보기 — 레이아웃을 다시 만들지 않고 CSS 로만 감춘다.
   숨겨진 화면도 계속 재생되므로 되돌아올 때 기다릴 필요가 없다. */
function setZoom(i){
  S.zoom = (S.zoom===i) ? -1 : i;
  const g=$('#grid');
  g.classList.toggle('zoomed', S.zoom>=0);
  $$('.cell').forEach(c=>c.classList.toggle('zoom', +c.dataset.i===S.zoom));
  $$('.gridrow').forEach(r=>r.classList.toggle('hasZoom', !!r.querySelector('.cell.zoom')));
  if(S.zoom>=0){ S.active=S.zoom; $$('.cell').forEach(c=>c.classList.toggle('sel',+c.dataset.i===S.zoom)); }
}
/* 재배치할 때 기존 화면을 절대 다시 만들지 않는다.
   innerHTML 로 갈아엎으면 video 가 파괴되어 재생 중인 화면이 전부 끊긴다.
   셀을 분리했다가 새 행에 다시 붙이면 요소가 살아 있어 재생이 유지된다. */
function render(){
  const g=$('#grid');
  $('#empty').classList.toggle('hide', S.open.length>0);
  const fresh=[];
  S.open.forEach(o=>{
    if(!o.cell){ o.cell=makeCell(o); fresh.push(o); }
    else o.cell.remove();                 // 부모에서만 분리 — 요소는 그대로 살아 있다
  });
  g.textContent='';                       // 남은 빈 행 컨테이너 제거
  let idx=0;
  if(S.zoom>=S.open.length) S.zoom=-1;          // 닫혀서 사라진 화면이면 해제
  const rows=rowsFor(S.open.length);
  /* 마지막 줄이 한 칸만 남으면 그 칸이 가로를 혼자 차지해 혼자만 두 배로 커진다.
     칸 폭을 줄 수가 아니라 열 수로 고정해 어느 줄이든 크기가 같게 한다. */
  g.style.setProperty('--cols', Math.max(1,...rows));
  rows.forEach(cnt=>{
    const r=document.createElement('div'); r.className='gridrow';
    for(let i=0;i<cnt && idx<S.open.length;i++,idx++){
      const o=S.open[idx];
      touchCell(o.cell,o,idx);
      r.appendChild(o.cell);
    }
    g.appendChild(r);
  });
  g.classList.toggle('zoomed', S.zoom>=0);
  $$('.gridrow').forEach(r=>r.classList.toggle('hasZoom', !!r.querySelector('.cell.zoom')));
  syncDense();
  fresh.forEach(o=>bind(o));              // 새로 만든 화면만 연결한다
  /* 대수가 바뀌면 화면당 버퍼·메모리 몫이 달라진다 — 이미 열린 화면에도 반영한다 */
  applyTune();
  /* Safari/iOS 는 DOM 에서 분리된 <video> 를 정지시킨다.
     위에서 셀을 옮겼으므로 이미 재생 중이던 화면도 다시 눌러줘야 한다.
     (Chrome 은 유지되지만 호출해도 무해하다) */
  S.open.forEach(o=>{
    const v=o.cell?.querySelector('video');
    if(v && v.paused && !v.ended) v.play().catch(()=>{});
  });
  renderLists();
}

function bind(o){
  const v=o.cell.querySelector('video');
  const ov=o.cell.querySelector('.ov');
  if(o.hls){ try{o.hls.destroy();}catch(_){} }
  // 'waiting' 리스너는 makeCell 에서 이미 한 번 걸어두었다(여기서 걸면 누적된다)
  if(!(window.Hls&&Hls.isSupported())){
    if(v.canPlayType('application/vnd.apple.mpegurl')){
      v.src=o.cam.u;
      v.addEventListener('loadeddata',()=>ov.classList.add('hide'),{once:true});
      /* 네이티브 재생에도 실패 처리를 건다.
         없으면 접속 자체가 실패했을 때 '연결 중…' 인 채로 영원히 방치된다. */
      v.addEventListener('error',()=>{
        ov.classList.remove('hide');
        ov.textContent='재생할 수 없습니다 — ↻ 를 눌러 다시 시도하세요';
      },{once:true});
      v.play().catch(()=>{});
    } else ov.textContent='이 브라우저는 재생을 지원하지 않습니다';
    return;
  }
  const hls=new Hls(hlsConfig()); o.hls=hls;
  o.margins=o.margins||[];
  /* 다시 붙이는 것은 새 출발이다. 이 값을 넘겨받으면 지난번에 3번을 채운 화면이
     새 연결에서 첫 오류에 곧바로 포기해 영영 살아나지 못한다. */
  o._mediaErr=0;
  hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
  hls.on(Hls.Events.FRAG_BUFFERED,()=>ov.classList.add('hide'));
  /* 조각 길이 ÷ 실제 다운로드 시간 = 회선 여유 배수.
     이 값이 이 기기·이 장소의 실제 여력을 그대로 말해준다. */
  hls.on(Hls.Events.FRAG_LOADED,(_e,d)=>{
    try{
      const st=d.frag?.stats||d.stats;
      const ms=Math.max(1,(st.loading.end-st.loading.start));
      const dur=(d.frag?.duration||1)*1000;
      o.margins.push(dur/ms);
      if(o.margins.length>8) o.margins.shift();
      o.lastMs=Math.round(ms);          // 배지에 그대로 띄운다
    }catch(_){}
  });
  hls.on(Hls.Events.ERROR,(_e,d)=>{
    if(!d.fatal) return;
    /* 복구 시도는 횟수를 제한한다. 무제한으로 돌리면 정말 복구 불가능한 상황
       (여러 대 동시 재생으로 디코더가 모자란 경우 등)에서 오류도 안 뜬 채
       조용히 CPU·배터리만 계속 태운다. */
    if(d.type===Hls.ErrorTypes.MEDIA_ERROR && (o._mediaErr=(o._mediaErr||0)+1)<=3){
      hls.recoverMediaError(); return;
    }
    try{ hls.destroy(); }catch(_){}
    o.hls=null;
    ov.classList.remove('hide');
    ov.textContent='재생할 수 없습니다 — ↻ 를 눌러 다시 시도하세요';
  });
  hls.on(Hls.Events.FRAG_BUFFERED,()=>{ o._mediaErr=0; o._tries=0; }); // 정상 재생되면 초기화
  hls.loadSource(o.cam.u); hls.attachMedia(v);
}

function openCam(cam){
  if(S.open.some(o=>o.cam.n===cam.n)) return;
  if(S.open.length>=MAX) return alert('최대 '+MAX+'개까지 동시에 볼 수 있습니다');
  S.open.push({cam,hls:null,cell:null});
  S.active=S.open.length-1;
  render();
  if(S.save) LS.set('open',S.open.map(o=>o.cam.n));
}
function closeCam(i){
  const o=S.open[i]; if(!o) return;
  if(o.hls){ try{o.hls.destroy();}catch(_){} }
  if(o.cell){
    /* hls.js 를 못 쓰는 브라우저(아이폰)는 video 에 주소를 직접 물린다.
       DOM 에서 빼기만 하면 그 연결이 남아 계속 받는다 — 명시적으로 끊는다. */
    const v=o.cell.querySelector('video');
    if(v){ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(_){} }
    o.cell.remove();                   // 닫힌 화면만 DOM 에서 뺀다
  }
  S.open.splice(i,1);
  /* splice 로 뒤쪽 항목이 한 칸씩 당겨진다.
     zoom·active 는 '번호'가 아니라 '보고 있던 화면'을 따라가야 한다.
     보정하지 않으면 C 를 닫았는데 D 가 확대되는 식으로 엉뚱한 화면이 잡힌다. */
  if(S.zoom===i) S.zoom=-1; else if(S.zoom>i) S.zoom--;
  if(S.active===i) S.active=Math.min(i, S.open.length-1);
  else if(S.active>i) S.active--;
  if(S.active<0) S.active=0;
  render();
  if(S.save) LS.set('open',S.open.map(o=>o.cam.n));
}
function closeAll(){ while(S.open.length) closeCam(0); }

/* ─────────── 목록 ─────────── */
const isOpen=n=>S.open.some(o=>o.cam.n===n);
const isFav=n=>S.favs.includes(n);
const row=(c,i)=>`<div class="item${isOpen(c.n)?' on':''}" data-n="${i}">
    <span class="idx">${String(i+1).padStart(2,'0')}</span>
    <span class="nm">${c.n}</span>
    <button class="star${isFav(c.n)?' on':''}" data-fav="${i}"
            title="${isFav(c.n)?'즐겨찾기에서 빼기':'즐겨찾기에 넣기'}">${isFav(c.n)?'★':'☆'}</button>
  </div>`;
function renderLists(){
  const favs=CAMS.filter(c=>isFav(c.n));
  $('#favList').innerHTML = favs.length
    ? favs.map(c=>row(c,CAMS.indexOf(c))).join('')
    : `<div style="padding:18px 14px;font-size:13px;line-height:1.7;color:var(--dim)">
         즐겨찾기가 비어 있습니다.<br>아래 <b>CCTV 목록</b>에서 ☆ 를 눌러 추가하세요.</div>`;
  $('#camList').innerHTML=CAMS.map((c,i)=>row(c,i)).join('');
  renderStrip();
}
function toggleFav(i){
  const c=CAMS[i]; if(!c) return;
  const k=S.favs.indexOf(c.n);
  if(k>=0) S.favs.splice(k,1); else S.favs.push(c.n);
  LS.set('favs',S.favs);
  renderLists();
}
/* 재해석 스킨의 하단 카메라 스트립 */
function renderStrip(){
  if(S.skin!=='reimagined'){ $('#strip').innerHTML=''; return; }
  // 즐겨찾기를 앞으로 (정렬은 안정적이라 나머지 순서는 그대로 유지된다)
  const order=CAMS.map((c,i)=>({c,i}))
    .sort((a,b)=>(isFav(b.c.n)?1:0)-(isFav(a.c.n)?1:0));
  $('#strip').innerHTML=order.map(({c,i})=>
    `<div class="scard${isOpen(c.n)?' on':''}${isFav(c.n)?' fav':''}" data-n="${i}">
       <span class="dot"></span>${isFav(c.n)?'★ ':''}${c.n}</div>`).join('');
  if(window.__stripSync) setTimeout(window.__stripSync,50);
}
$('#strip').onclick=e=>{const s=e.target.closest('.scard'); if(s) pick(+s.dataset.n);};

function pick(i){ const c=CAMS[i]; if(!c) return;
  if(isOpen(c.n)){ closeCam(S.open.findIndex(o=>o.cam.n===c.n)); } else openCam(c); }
function listClick(e){
  const st=e.target.closest('[data-fav]');
  if(st){ e.stopPropagation(); toggleFav(+st.dataset.fav); return; }
  const it=e.target.closest('.item'); if(it) pick(+it.dataset.n);
}
$('#favList').onclick=listClick;
$('#camList').onclick=listClick;
$('#grid').onclick=e=>{
  const x=e.target.closest('[data-close]');
  if(x){ e.stopPropagation(); closeCam(+x.dataset.close); return; }
  const r=e.target.closest('[data-reload]');
  if(r){ e.stopPropagation(); reloadOne(+r.dataset.reload, r); return; }
  const g=e.target.closest('[data-mag]');
  if(g){ e.stopPropagation(); const i=+g.dataset.mag; setMag(i, !(S.open[i]?.mag>1)); return; }
  const z=e.target.closest('[data-zoom]');
  if(z){ e.stopPropagation(); setZoom(+z.dataset.zoom); return; }
  const c=e.target.closest('.cell');
  if(c){ S.active=+c.dataset.i; $$('.cell').forEach(el=>el.classList.toggle('sel',el===c)); }
};
$('#grid').addEventListener('dblclick',e=>{
  /* 버튼을 두 번 누르면 click 두 번에 이어 dblclick 까지 와서
     크게 보기가 열렸다 닫혔다 다시 열린다 — 버튼 위에서는 무시한다 */
  if(e.target.closest('[data-zoom],[data-close],[data-reload],[data-mag],.vbox')) return;
  const c=e.target.closest('.cell');
  if(c) setZoom(+c.dataset.i);
});

/* 한 화면만 다시 연결 — 전체를 끊지 않는다 */
function reloadOne(i, btn){
  const o=S.open[i]; if(!o) return;
  if(btn){ btn.classList.add('spin'); setTimeout(()=>btn.classList.remove('spin'),1200); }
  const ov=o.cell?.querySelector('.ov');
  if(ov){ ov.classList.remove('hide'); ov.textContent='다시 연결 중…'; }
  o._stuck=0; o._lastT=-1;
  bind(o);
}

/* 멈춤 자동 복구 — 재생 중인데 시간이 안 흐르면 그 화면만 조용히 다시 연결한다.
   여러 대를 동시에 볼 때 한 대가 굳어버리는 상황을 사용자가 눈치채기 전에 되살린다. */
function healTick(){
  // 절전으로 세워둔 동안에는 되살리지 않는다
  if(dormant) return;
  const now=Date.now();
  /* 한 주기에 한 화면만 다시 붙인다 — 전부 동시에 붙이면 회선을 서로 빼앗아
     멀쩡하던 화면까지 같이 끊긴다.
     다만 앞 번호부터 찾으면 1번이 계속 말썽일 때 뒤 번호는 순서가 영영 오지 않는다.
     그래서 '가장 오래 멈춰 있는 하나'를 골라 되살린다. */
  let worst=null, worstScore=0;
  S.open.forEach((o,i)=>{
    const v=o.cell?.querySelector('video');
    if(!v) return;
    /* 카메라 쪽 인코더가 실시간보다 느리게 조각을 뱉는 경우가 있다(실측 1/3 속도).
       그런 화면을 라이브로 당기고 1.5배로 재생하면 버퍼만 더 빨리 비워 계속 끊긴다.
       조각이 늘어나는 속도를 재서 느린 소스는 따로 다룬다. */
    const edge=edgeOf(o.hls);
    if(edge!=null && isFinite(edge)){
      /* 조각은 2초에 하나씩 뚝뚝 늘어나므로 주기마다 재면 0과 2 사이를 널뛴다.
         30초 창으로 재야 '초당 몇 초치가 생산되는가'가 제대로 나온다. */
      if(o._e0==null || edge<o._e0){ o._e0=edge; o._t0=now; }
      else if(now-o._t0>=12000){
        o._rate=(edge-o._e0)/((now-o._t0)/1000);
        if(now-o._t0>=30000){ o._e0=edge; o._t0=now; }   // 창을 밀어 최근 상태를 본다
      }
    }
    o.slow = o._rate!=null && o._rate<0.75;   // 실시간의 75% 미만이면 느린 소스
    o.cell?.classList.toggle('slow', o.slow);
    /* 느린 소스를 재촉하지 않는다 — 있는 만큼 그대로 흘린다.
       다시 붙을 때마다 설정이 원래대로 돌아오므로 매번 확인한다. */
    const want = o.slow ? 1 : modeCfg().rate;
    if(o.hls && o.hls.config.maxLiveSyncPlaybackRate!==want)
      o.hls.config.maxLiveSyncPlaybackRate=want;
    if(o.slow && v.playbackRate>1) v.playbackRate=1;

    let score=0;
    if(v.paused && !v.ended){
      /* 멈춰 있으면 먼저 다시 눌러본다.
         다만 눌러도 안 살아나는 경우가 있다(디코더가 모자라거나 자동재생이 막힌 경우).
         예전에는 여기서 그냥 넘어가 버려 그런 화면은 누르기만 반복하며
         영영 멈춘 채 남았다 — 오래 끌면 아예 다시 붙인다. */
      v.play().catch(()=>{});
      o._lastT=-1;
      o._dead=(o._dead||0)+1;
      if(o._dead>=5) score=o._dead*2;  // 10초 넘게 눌러도 그대로면
    } else {
      o._dead=0;
      if(v.readyState<2){              // 재생 시작조차 못 한 채 머무는 중
        o._cold=(o._cold||0)+1;
        if(o._cold>=8) score=o._cold;
      } else {
        o._cold=0;
        /* 딱 멈춘 것만 세면 2초에 0.1초씩 기어가는 화면을 정상으로 넘겨버린다.
           다만 소스가 느린 화면은 느린 게 정상이므로 완전 정지만 본다. */
        const adv = o._lastT==null ? null : v.currentTime-o._lastT;
        if(adv!=null && adv < (o.slow?0.02:0.4)){
          o._stuck=(o._stuck||0)+1;
          if(o._stuck>=3) score=o._stuck*3;  // 약 6초간 제자리 — 더 급한 증상
        } else o._stuck=0;
        o._lastT=v.currentTime;
      }
    }
    /* 살아나지 못하는 화면을 2초마다 다시 붙이면 회선만 태우고 남은 화면까지 방해한다.
       실패가 이어질수록 간격을 벌린다(8초→최대 2분). 한 번 성공하면 다시 짧아진다. */
    const wait=Math.min(120000, 8000*Math.pow(2, Math.min(4, o._tries||0)));
    if(score && now-(o._lastTry||0)>wait && score>worstScore){ worst={o,i}; worstScore=score; }
  });
  if(worst){
    const {o,i}=worst;
    o._cold=0; o._stuck=0; o._dead=0; o._lastTry=now; o._tries=(o._tries||0)+1;
    onStall();                         // 버퍼도 함께 늘린다(4초 내 중복은 무시됨)
    reloadOne(i, o.cell?.querySelector('.rf'));
  }
}
setInterval(healTick, 2000);

/* ─────────── 세로 탭 (원본 재현) ─────────── */
function vtabText(el,txt){ el.innerHTML=txt.split('').map(ch=>`<span>${ch===' '?'&nbsp;':ch}</span>`).join(''); }
vtabText($('#tabFav'),'즐겨찾기 목록');
vtabText($('#tabCam'),'CCTV 목록');
const narrow=()=>window.innerWidth<=760;
$('#tabFav').onclick=()=>{S.colFav=!S.colFav;$('#colFav').classList.toggle('hide',!S.colFav);};
$('#tabCam').onclick=()=>{S.colCam=!S.colCam;$('#colCam').classList.toggle('hide',!S.colCam);};

/* 좁은 화면: 두 목록을 나란히 두면 각각이 너무 좁아 이름도 ★ 도 못 누른다.
   탭으로 하나씩 전체 폭을 쓰게 한다. */
function showCol(which){
  S.listTab=which;
  const nb=narrow();
  $('#colFav').classList.toggle('hide', nb ? which!=='fav' : !S.colFav);
  $('#colCam').classList.toggle('hide', nb ? which!=='cam' : !S.colCam);
  $$('#listTabs button[data-col]').forEach(b=>b.classList.toggle('on',b.dataset.col===which));
}
$$('#listTabs button[data-col]').forEach(b=>b.onclick=()=>showCol(b.dataset.col));
$('#bCloseSide2').onclick=()=>setSide(false);
/* 칸이 많아 작아지면 버튼이 겹치므로 '빽빽함' 표시를 켜서 CSS 가 정리하게 한다 */
function syncDense(){
  $('#grid').classList.toggle('dense', narrow() && S.open.length>4);
}
window.addEventListener('resize',()=>{ showCol(S.listTab||'fav'); syncDense(); setSide(S.sideOpen); });

/* 목록 열고 닫기 — 겹쳐 뜨는 상황(재해석·모바일)에서는
   ☰ 가 가려지므로 닫기 버튼·배경 클릭·ESC 를 모두 받아준다. */
function setSide(open){
  S.sideOpen=open;
  $('#side').classList.toggle('closed',!open);
  const overlay = S.skin==='reimagined' || narrow();
  $('#sideBackdrop').classList.toggle('on', open && overlay);
  // 좁은 화면에는 탭 줄에 ✕ 가 있으므로 본문 버튼은 넓은 화면에서만 쓴다
  $('#bCloseSide').style.display = (overlay && !narrow()) ? '' : 'none';
  if(open) showCol(S.listTab||'fav');
}

/* 기존 프로그램의 단축키를 그대로 옮긴다 —
   숫자 1~9 로 그 번호를 크게, 0 으로 전체 보기, Q 다시 연결, W/E 명암. */
function toast(msg){
  let t=$('#toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1100);
}
function setContrast(v){
  S.contrast=Math.min(1.8, Math.max(0.6, Math.round(v*10)/10));
  document.documentElement.style.setProperty('--vfx', S.contrast);
  LS.set('contrast', S.contrast);
  toast('명암 '+Math.round(S.contrast*100)+'%');
}
setContrast(LS.get('contrast',1));
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.altKey||e.metaKey) return;
  const tg=e.target;                         // 입력 중에는 건드리지 않는다
  if(tg && tg.closest && tg.closest('input,textarea,select')) return;
  if(e.key==='Escape'){
    if($('#sheet').classList.contains('on')) $('#sheet').classList.remove('on');
    else if(S.zoom>=0) setZoom(S.zoom);      // 크게 보기 해제
    else if(S.sideOpen) setSide(false);
    return;
  }
  if(!S.open.length) return;
  const k=e.key.toLowerCase();
  /* 넘패드 +/− 는 보고 있는 화면(크게 본 것이 있으면 그것)을 당기고 되돌린다 */
  if(e.key==='+'||e.key==='-'){
    const i = S.zoom>=0 ? S.zoom : S.active;
    if(S.open[i]){ setMag(i, e.key==='+'); toast(e.key==='+'?'돋보기 켬':'돋보기 끔'); }
    return;
  }
  if(k==='w'){ setContrast(S.contrast-0.1); return; }
  if(k==='e'){ setContrast(S.contrast+0.1); return; }
  if(k==='q'){                               // 전부 다시 연결 — 한꺼번에 붙이면 서로 회선을 뺏는다
    toast('전체 다시 연결');
    S.open.forEach((o,i)=>setTimeout(()=>reloadOne(i, o.cell?.querySelector('.rf')), i*400));
    return;
  }
  if(/^[0-9]$/.test(e.key)){
    const n=+e.key;
    if(n===0){ if(S.zoom>=0) setZoom(S.zoom); }        // 0 은 전체 보기로 되돌린다
    else if(n<=S.open.length) setZoom(n-1);            // 같은 번호를 다시 누르면 해제된다
    return;
  }
});

/* 하단 스트립 — 휠·드래그·화살표로 좌우 이동 */
(function stripNav(){
  const st=$('#strip');
  st.addEventListener('wheel',e=>{
    if(!e.deltaY || e.shiftKey) return;
    e.preventDefault(); st.scrollLeft += e.deltaY;
  },{passive:false});
  let down=false,x0=0,l0=0,moved=0;
  st.addEventListener('pointerdown',e=>{
    down=true;moved=0;x0=e.clientX;l0=st.scrollLeft;st.classList.add('drag');
  });
  st.addEventListener('pointermove',e=>{
    if(!down) return;
    const d=e.clientX-x0; moved=Math.max(moved,Math.abs(d));
    st.scrollLeft=l0-d;
  });
  const up=()=>{ down=false; st.classList.remove('drag'); };
  st.addEventListener('pointerup',up); st.addEventListener('pointerleave',up);
  // 끌어서 이동한 뒤에는 클릭으로 오인하지 않게 막는다
  st.addEventListener('click',e=>{ if(moved>6){ e.stopPropagation(); e.preventDefault(); } },true);
  // CSS 의 scroll-behavior:smooth 가 부드럽게 처리하므로 값만 바꾼다
  const page=()=>Math.max(160,st.clientWidth*0.8);
  $('#sLeft').onclick=()=>{ st.scrollLeft-=page(); };
  $('#sRight').onclick=()=>{ st.scrollLeft+=page(); };
  const sync=()=>{
    $('#sLeft').classList.toggle('off', st.scrollLeft<=2);
    $('#sRight').classList.toggle('off', st.scrollLeft>=st.scrollWidth-st.clientWidth-2);
  };
  st.addEventListener('scroll',sync); window.addEventListener('resize',sync);
  setTimeout(sync,300);
  window.__stripSync=sync;
})();

   :S.mode==='bal'  ? '지연과 안정성의 중간입니다.'

/* ─────────── 라이브 표시 ─────────── */
function updateDiag(){
  if(!$('#sheet').classList.contains('on')) return;
  const b=bufFor(), c=navigator.connection||{};
  const mg=Tune.margin, mb=Tune.minBuf;
  const grade = mg==null?'측정 중':mg>=3.5?'넉넉함':mg>=1.8?'보통':'빠듯함';
  $('#diag').innerHTML=
    `버퍼 <b>${b.toFixed(1)}초</b> · 재생 ${S.open.length}대`+
    (Tune.why?` <span style="opacity:.7">(${Tune.why})</span>`:'')+
    `<br>회선 여유 <b>${mg==null?'—':mg.toFixed(1)+'배'}</b> (${grade})`+
    (mb!=null?` · 남은 버퍼 ${mb.toFixed(1)}초`:'')+
    (c.effectiveType?` · ${c.effectiveType}`:'')+
    (c.downlink?` ~${c.downlink}Mbps`:'')+
    (Tune.seeks?`<br>라이브 복귀 ${Tune.seeks}회`:'')+
    (Tune.stalls?` · 버퍼 상향 ${Tune.stalls}회`:'');
}
setInterval(()=>{
  const o=S.open[S.active], el=$('#live');
  let d=null;
  try{
    if(o?.hls){
      const edge=edgeOf(o.hls), v=o.cell?.querySelector('video');
      if(edge!=null&&v&&v.currentTime>0) d=edge-v.currentTime;
    }
  }catch(_){}
  if(d==null||!isFinite(d)){ el.textContent='—'; el.className='live'; }
  else { el.textContent='라이브 -'+d.toFixed(1)+'초';
         el.className='live '+(d<2.5?'g':d<5?'y':'r'); }
  /* 화면마다 조각 받는 데 걸린 시간과 현재 라이브 지연을 띄운다 */
  S.open.forEach(x=>{
    const b=x.cell?.querySelector('.bdg'); if(!b) return;
    const xv=x.cell.querySelector('video');
    let lag=null;
    try{ const e=edgeOf(x.hls);
      if(e!=null && isFinite(e) && xv && xv.currentTime>0) lag=e-xv.currentTime; }catch(_){}
    /* 받는 시간(ms)은 회선 상태, 배속(x)은 카메라가 실시간만큼 보내주는지를 뜻한다.
       카메라가 느리면 회선이 멀쩡해도 끊기므로 둘을 같이 보여야 구분이 된다. */
    b.textContent = (x.lastMs!=null ? x.lastMs+'ms' : '—')
                  + (lag!=null && isFinite(lag) ? ' · '+lag.toFixed(1)+'초' : '')
                  + (x._rate!=null ? ' · '+x._rate.toFixed(2)+'x' : '');
  });
  updateDiag();
},500);

/* ─────────── 로그인 (accounts.json 있을 때만) ─────────── */
const encT=new TextEncoder(), decT=new TextDecoder();
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptKey(acc,pw,iter){
  const base=await crypto.subtle.importKey('raw',encT.encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(acc.salt),iterations:iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  return decT.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(acc.iv)},k,unb64(acc.ct)));
}
let ACCTS=null;
async function initGate(){
  try{
    const r=await fetch('accounts.json?_='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    ACCTS=await r.json();
  }catch(_){ return false; }            // 계정 파일이 없으면 로그인 없이 사용
  const today=new Date().toISOString().slice(0,10);
  const ok=(ACCTS.accounts||[]).filter(a=>a.active!==false&&(!a.expires||a.expires>=today));
  if(!ok.length) return false;
  $('#gid').innerHTML=ok.map(a=>`<option value="${a.id}">${a.name||a.id}</option>`).join('');
  const sess=LS.get('sess',null);
  if(sess&&ok.some(a=>a.id===sess)) return false;   // 이미 로그인함
  $('#gate').classList.remove('hide'); $('#app').classList.add('hide');
  return true;
}
$('#gform').addEventListener('submit',async e=>{
  e.preventDefault();
  const acc=(ACCTS?.accounts||[]).find(a=>a.id===$('#gid').value);
  if(!acc) return;
  try{
    await decryptKey(acc,$('#gpw').value,ACCTS.iterations||210000);
    LS.set('sess',acc.id);
    $('#gate').classList.add('hide'); $('#app').classList.remove('hide');
    start();
  }catch(_){
    const m=$('#gmsg'); m.textContent='비밀번호가 올바르지 않습니다.'; m.className='gmsg on';
    $('#gpw').value='';
  }
});

/* ─────────── 시작 ─────────── */
function loadScript(a){return new Promise(r=>{let i=0;(function n(){
  if(i>=a.length)return r(false);const s=document.createElement('script');
  s.src=a[i++];s.onload=()=>r(true);s.onerror=n;document.head.appendChild(s);})();});}

/* 무음 영상은 화면 꺼짐을 막지 못한다 — 폰이 제 시간(보통 15~30분)에 잠긴다.
   감시 화면으로 띄워두는 용도이므로 켜져 있는 동안은 잠금을 막는다.
   탭을 벗어나면 잠금이 자동 해제되므로 돌아올 때 다시 잡는다. */
let wake=null;
async function keepAwake(){
  if(!('wakeLock' in navigator) || document.visibilityState!=='visible') return;
  try{
    if(wake && !wake.released) return;
    wake=await navigator.wakeLock.request('screen');
    wake.addEventListener('release',()=>{ wake=null; });
  }catch(e){}                          // 배터리 절약 모드 등에서는 거부된다 — 무시
}
/* 화면이 꺼지거나 다른 앱으로 넘어가면 열두 대를 계속 받을 이유가 없다.
   그대로 두면 배터리·데이터만 태우고, 돌아와도 어차피 한참 밀린 화면을 다시 당겨야 한다.
   24시간 켜 두는 쓰임이라 이 차이가 크다. */
function pauseStreams(){
  dormant=true;
  S.open.forEach(o=>{
    try{ o.hls && o.hls.stopLoad(); }catch(_){}
    const v=o.cell?.querySelector('video'); if(v) v.pause();
  });
}
function resumeStreams(){
  dormant=false;
  S.open.forEach(o=>{
    try{ o.hls && o.hls.startLoad(); }catch(_){}
    const v=o.cell?.querySelector('video'); if(v) v.play().catch(()=>{});
  });
  // 밀린 만큼은 엣지 복귀 감시가 알아서 당긴다
}
document.addEventListener('visibilitychange',()=>{
  clearTimeout(sleepTimer); sleepTimer=null;
  if(document.visibilityState==='visible'){ keepAwake(); if(dormant) resumeStreams(); }
  /* 알림을 확인하는 정도의 짧은 이탈까지 끊으면 돌아올 때마다 다시 붙느라 더 답답하다.
     한동안 계속 안 보일 때만 세운다. */
  else sleepTimer=setTimeout(pauseStreams, 15000);
});

function start(){
  keepAwake();
  const saved=S.save?LS.get('open',null):null;
  // 저장된 화면이 있으면 그대로, 없으면 즐겨찾기 전체를 띄운다
  const list=(saved&&saved.length)
    ? saved.map(n=>CAMS.find(c=>c.n===n)).filter(Boolean)
    : CAMS.filter(c=>S.favs.includes(c.n));
  (list.length?list:[CAMS[0]]).slice(0,MAX).forEach(c=>{
    if(!S.open.some(o=>o.cam.n===c.n)) S.open.push({cam:c,hls:null,cell:null});
  });
  render();
}

(async()=>{
  applySkin();
  loadLearned();                       // 이 환경에서 이전에 검증된 값이 있으면 그걸로 시작
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  await loadScript(['https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js',
                    'https://unpkg.com/hls.js@1/dist/hls.min.js']);
  const needLogin=await initGate();
  if(!needLogin){ $('#gate').classList.add('hide'); $('#app').classList.remove('hide'); start(); }
})();
</script>
